name: pipeline-nightly-train

on:
  schedule:
    - cron: "23 9 * * *"      # 09:23 UTC daily (after the US slate has settled)
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the retrain policy"
        type: boolean
        default: false

concurrency:
  group: snapbet-pipeline-db
  cancel-in-progress: false

permissions:
  contents: write           # commits refreshed model artifacts

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e .
      - name: sync training rows + features
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PIPELINE_SPORTS: ${{ vars.PIPELINE_SPORTS }}
        run: snapbet-pipeline sync
      - name: train (policy-gated)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PIPELINE_SPORTS: ${{ vars.PIPELINE_SPORTS }}
        run: snapbet-pipeline train ${{ inputs.force && '--force' || '' }}
      - name: commit refreshed model artifacts
        run: |
          git config user.name "snapbet-pipeline[bot]"
          git config user.email "pipeline@users.noreply.github.com"
          git add models
          if git diff --cached --quiet; then
            echo "no model changes"
          else
            git commit -m "models: nightly retrain $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
      - name: publish predictions with the refreshed models
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PIPELINE_SPORTS: ${{ vars.PIPELINE_SPORTS }}
        run: snapbet-pipeline predict
