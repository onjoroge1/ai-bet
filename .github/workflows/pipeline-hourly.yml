name: pipeline-hourly

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 UTC
  workflow_dispatch:

concurrency:
  group: snapbet-pipeline-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e .
      - name: collect + results + sync + predict + settle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PIPELINE_SPORTS: ${{ vars.PIPELINE_SPORTS }}
        run: snapbet-pipeline run
